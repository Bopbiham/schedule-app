<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⏱ Thời Gian Biểu Tuần</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0C0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TGB">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<!-- Firebase v9 compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0D14;--surf:#12141E;--card:#181A28;--card2:#1E2034;
  --brd:#23263C;--brd2:#2C3050;--txt:#DCE1F5;--txt2:#7E87A8;--txt3:#454B68;
  --acc:#5B80FF;--acc2:rgba(91,128,255,.13);
  --ok:#34C27A;--ok2:rgba(52,194,122,.12);
  --warn:#F09030;--warn2:rgba(240,144,48,.12);
  --err:#E05060;--err2:rgba(224,80,96,.12);
  --fn:'Manrope','Segoe UI',sans-serif;
  --r:10px;--rs:7px;--rl:16px;
  --hh:52px;--sw:214px;--pw:310px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fn);background:var(--bg);color:var(--txt);min-height:100vh;font-size:13px;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
input,textarea,select,button{font-family:var(--fn);font-size:13px}
a{color:var(--acc);text-decoration:none}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:200;height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(12,13,20,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd)}
.hdr-title{font-size:14px;font-weight:800;flex:1;display:flex;align-items:center;gap:7px;white-space:nowrap}
.hdr-title em{font-size:19px;font-style:normal}
.hbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rs);border:1px solid var(--brd);background:transparent;color:var(--txt2);font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.hbtn:hover{background:var(--card);color:var(--txt);border-color:var(--brd2)}
.hbtn.on{background:var(--acc2);color:var(--acc);border-color:rgba(91,128,255,.35)}
.hbtn.edit-on{background:var(--warn2);color:var(--warn);border-color:rgba(240,144,48,.35)}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - var(--hh))}

/* ── SIDEBAR ── */
.sidebar{width:var(--sw);flex-shrink:0;overflow-y:auto;padding:14px 10px;border-right:1px solid var(--brd);display:flex;flex-direction:column;gap:14px}
.sb-section-title{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.day-nav{display:flex;flex-direction:column;gap:2px}
.day-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;border:1px solid transparent;color:var(--txt2);font-size:12.5px;font-weight:500;transition:.14s;background:none;width:100%;text-align:left}
.day-btn:hover{background:var(--card);color:var(--txt)}
.day-btn.awd{background:var(--acc2);color:var(--acc);border-color:rgba(91,128,255,.28);font-weight:700}
.day-btn.awe{background:rgba(236,72,153,.1);color:#EC4899;border-color:rgba(236,72,153,.25);font-weight:700}
.day-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.today-badge{font-size:9px;background:var(--ok);color:#fff;padding:1px 5px;border-radius:10px;font-weight:700;margin-left:auto}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:16px 18px;min-width:0}

/* ── PANEL ── */
.panel{width:var(--pw);flex-shrink:0;border-left:1px solid var(--brd);display:flex;flex-direction:column;transition:.2s;overflow:hidden}
.panel.closed{width:0;border:none}
.ptabs{display:flex;border-bottom:1px solid var(--brd);flex-shrink:0}
.ptab{flex:1;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--txt3);cursor:pointer;transition:.14s;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.on{color:var(--acc);border-color:var(--acc)}
.pcontent{flex:1;overflow-y:auto;padding:14px;display:none}
.pcontent.on{display:block}
.ai-wrap{flex:1;display:none;flex-direction:column;overflow:hidden}
.ai-wrap.on{display:flex}

/* ── DAY HEADER ── */
.day-hdr{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day-hdr h2{font-size:16px;font-weight:800;margin-bottom:5px}
.day-meta{display:flex;flex-wrap:wrap;gap:8px}
.meta-chip{font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:4px}

/* ── PROGRESS ── */
.prog-wrap{margin-bottom:10px}
.prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-bottom:4px}
.prog-bg{height:5px;background:var(--brd);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:.4s;background:var(--ok)}

/* ── SCHEDULE ── */
.sched-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:52px 3px 1fr;gap:0 9px;align-items:stretch}
.stime{font-size:11px;color:var(--txt3);padding-top:10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sbar{border-radius:2px;min-height:38px;transition:.2s}
.scard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:8px 10px;display:flex;align-items:flex-start;gap:8px;transition:.14s;position:relative}
.scard:hover{border-color:var(--brd2);background:var(--card2)}
.scard.done{opacity:.5}
.scard.done .sact{text-decoration:line-through;color:var(--txt3)}
.scard.current-item{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.scard.in-edit-mode{cursor:pointer}
.scard.in-edit-mode:hover{border-color:var(--warn);background:var(--card2)}

.chk{width:18px;height:18px;min-width:18px;border:1.5px solid var(--brd2);border-radius:4px;cursor:pointer;transition:.14s;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.chk:hover{border-color:var(--ok)}
.chk.yes{background:var(--ok);border-color:var(--ok);color:#fff}

.sbody{flex:1;min-width:0}
.sact{font-size:13px;font-weight:600;color:var(--txt);line-height:1.4}
.stip{font-size:11px;color:var(--txt2);margin-top:3px;line-height:1.45}
.sdur{font-size:10px;color:var(--txt3);margin-top:2px}

.sactions{display:flex;gap:3px;flex-shrink:0;margin-top:1px;opacity:0;transition:.14s}
.scard:hover .sactions{opacity:1}
.iBtn{width:24px;height:24px;border-radius:5px;border:none;background:transparent;color:var(--txt3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:.14s}
.iBtn:hover{background:var(--brd);color:var(--txt)}
.iBtn.del:hover{background:var(--err);color:#fff}
.iBtn.timer-btn-item:hover{background:var(--ok2);color:var(--ok)}

/* ── ADD ITEM ── */
.add-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:var(--r);border:1.5px dashed var(--brd2);background:transparent;color:var(--txt3);font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:.15s;margin-bottom:12px}
.add-btn:hover{border-color:var(--acc);color:var(--acc)}

/* ── NOTES ── */
.notes-wrap{margin-top:4px;margin-bottom:16px}
.notes-lbl{font-size:11px;font-weight:700;color:var(--txt3);margin-bottom:6px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.4px}
.notes-ta{width:100%;min-height:68px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:10px 12px;color:var(--txt);font-size:12px;line-height:1.6;resize:vertical;outline:none;transition:.15s}
.notes-ta:focus{border-color:var(--acc)}
.notes-ta::placeholder{color:var(--txt3)}

/* ── LEGEND ── */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--txt2)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── STATS PANEL ── */
.stat-section{margin-bottom:18px}
.stat-title{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-label{font-size:11px;color:var(--txt2);width:66px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:14px;background:var(--brd);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:.5s}
.bar-val{font-size:10px;color:var(--txt3);width:36px;flex-shrink:0}

/* ── STREAK SIDEBAR ── */
.streak-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd)}
.streak-item:last-child{border:none}
.streak-name{font-size:11.5px;color:var(--txt2)}
.streak-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px}
.streak-badge.s0{background:var(--brd);color:var(--txt3)}
.streak-badge.s1{background:var(--warn2);color:var(--warn)}
.streak-badge.s2{background:var(--ok2);color:var(--ok)}
.streak-badge.s3{background:var(--acc2);color:var(--acc)}

/* ── WEEKLY STRIP ── */
.strip-row{display:flex;align-items:center;gap:3px;margin-bottom:4px}
.strip-lbl{font-size:10px;color:var(--txt3);width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.strip-cells{display:flex;gap:2px;flex:1}
.strip-cell{flex:1;height:10px;border-radius:2px}
.strip-days{display:flex;gap:2px;margin-top:3px;padding-left:58px}
.strip-day-lbl{flex:1;text-align:center;font-size:9px;color:var(--txt3)}

/* ── AI CHAT ── */
.ai-hdr{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ai-title{font-size:12px;font-weight:700;flex:1}
.ai-cfg-btn{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:15px;line-height:1}
.ai-cfg-btn:hover{color:var(--txt)}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.amsg{padding:8px 10px;border-radius:var(--r);max-width:92%;font-size:12px;line-height:1.55}
.amsg.u{background:var(--acc2);color:var(--txt);align-self:flex-end;border-radius:10px 10px 3px 10px}
.amsg.a{background:var(--card2);color:var(--txt2);align-self:flex-start;border-radius:3px 10px 10px 10px;border:1px solid var(--brd)}
.amsg.sys{color:var(--txt3);font-size:11px;text-align:center;align-self:center;font-style:italic}
.amsg.thinking{color:var(--txt3);font-size:11px;align-self:flex-start;font-style:italic;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.ai-inp-wrap{padding:10px;border-top:1px solid var(--brd);display:flex;gap:7px;flex-shrink:0}
.ai-inp{flex:1;background:var(--card);border:1px solid var(--brd);border-radius:var(--rs);padding:8px 10px;color:var(--txt);font-size:12px;outline:none;resize:none;transition:.15s;max-height:80px;line-height:1.4}
.ai-inp:focus{border-color:var(--acc)}
.ai-inp::placeholder{color:var(--txt3)}
.ai-send{width:34px;height:34px;border-radius:var(--rs);background:var(--acc);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.15s;align-self:flex-end}
.ai-send:hover{background:#4F73E8}
.ai-send:disabled{background:var(--brd);cursor:not-allowed}

/* ── TIMER WIDGET ── */
.timer-w{position:fixed;bottom:22px;right:22px;z-index:300;background:var(--card2);border:1px solid var(--brd2);border-radius:var(--rl);padding:13px 16px;box-shadow:0 8px 32px rgba(0,0,0,.55);min-width:190px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.timer-lbl{font-size:10px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.timer-disp{font-size:32px;font-weight:800;color:var(--txt);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.timer-disp.warning{color:var(--warn)}
.timer-disp.done{color:var(--ok)}
.timer-ctrl{display:flex;gap:6px;margin-top:8px}
.tcBtn{flex:1;padding:5px;border-radius:var(--rs);border:1px solid var(--brd2);background:transparent;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;transition:.14s}
.tcBtn:hover{background:var(--card);color:var(--txt)}
.tcBtn.stop:hover{background:var(--err);color:#fff;border-color:var(--err)}

/* ── FOCUS MODE ── */
.focus-ov{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.focus-ov.hidden{display:none}
.focus-tag{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.focus-act{font-size:26px;font-weight:800;color:var(--txt);text-align:center;max-width:440px;line-height:1.3}
.focus-clk{font-size:80px;font-weight:800;color:var(--acc);letter-spacing:-4px;font-variant-numeric:tabular-nums;line-height:1}
.focus-next{font-size:12px;color:var(--txt3);margin-top:4px}
.focus-exit{position:absolute;top:18px;right:18px;padding:8px 14px;border-radius:var(--rs);border:1px solid var(--brd2);background:var(--card);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer}
.focus-exit:hover{color:var(--txt)}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-ov.hidden{display:none}
.modal-box{background:var(--card2);border:1px solid var(--brd2);border-radius:var(--rl);padding:20px;width:100%;max-width:420px;animation:mIn .18s ease}
@keyframes mIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:14px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--txt3);font-size:20px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--txt)}
.mfield{margin-bottom:10px}
.mfield label{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.minput,.mselect,.mtextarea{width:100%;background:var(--surf);border:1px solid var(--brd2);border-radius:var(--rs);padding:8px 11px;color:var(--txt);font-size:13px;outline:none;transition:.14s}
.minput:focus,.mselect:focus,.mtextarea:focus{border-color:var(--acc)}
.mtextarea{min-height:60px;resize:vertical;line-height:1.5}
.mrow{display:flex;gap:8px}
.mfooter{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{padding:7px 16px;border-radius:var(--rs);border:none;font-size:12px;font-weight:700;cursor:pointer;transition:.14s}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:#4F73E8}
.btn-g{background:var(--brd);color:var(--txt2)}
.btn-g:hover{color:var(--txt);background:var(--brd2)}
.btn-d{background:var(--err);color:#fff}

/* ── MOBILE ── */
.mob-day-row{display:none;gap:6px;padding:10px 14px 8px;overflow-x:auto;border-bottom:1px solid var(--brd);flex-shrink:0}
.mob-day-btn{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1px solid var(--brd);background:var(--card);color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;transition:.14s;white-space:nowrap}
.mob-day-btn.awd{background:var(--acc2);color:var(--acc);border-color:rgba(91,128,255,.3)}
.mob-day-btn.awe{background:rgba(236,72,153,.1);color:#EC4899;border-color:rgba(236,72,153,.22)}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);padding:7px 0 11px;z-index:150}
.mob-nav-inner{display:flex;justify-content:space-around}
.mnbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 14px;border-radius:var(--rs);background:none;border:none;color:var(--txt3);font-size:9px;font-weight:700;cursor:pointer;transition:.14s;text-transform:uppercase;letter-spacing:.3px}
.mnbtn em{font-size:20px;font-style:normal;line-height:1}
.mnbtn.on{color:var(--acc)}

/* ── MOBILE VIEWS ── */
.mob-view{display:none}
.mob-view.on{display:block}

/* ── MISC ── */
.divider{height:1px;background:var(--brd);margin:10px 0}
.hidden{display:none!important}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(max-width:768px){
  :root{--hh:48px}
  .sidebar,.panel{display:none}
  .mob-day-row{display:flex}
  .mob-nav{display:block}
  .main{padding:12px 13px 84px}
  .hdr-hide{display:none}
  .timer-w{bottom:72px;right:10px;left:10px;min-width:0}
  .focus-clk{font-size:60px}
}
@media(min-width:769px){
  .mob-day-row,.mob-nav{display:none!important}
}

/* ── SYNC STATUS ── */
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:.3s}
.sync-dot.synced{background:var(--ok)}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.offline{background:var(--txt3)}
.sync-dot.error{background:var(--err)}
.sync-dot.pending{background:var(--warn)}

/* ── AUTH BUTTON ── */
.auth-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--rs);border:1px solid var(--brd);background:transparent;color:var(--txt2);font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;flex-shrink:0}
.auth-btn:hover{background:var(--card);color:var(--txt);border-color:var(--brd2)}
.auth-btn.signed-in{border-color:rgba(52,194,122,.35);color:var(--ok);background:var(--ok2)}
.user-avatar{width:20px;height:20px;border-radius:50%;object-fit:cover}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card2);border:1px solid var(--brd2);color:var(--txt);padding:9px 16px;border-radius:var(--r);font-size:12px;font-weight:600;z-index:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:769px){.toast{bottom:24px}}
</style>
</head>
<body>

<!-- ── TIMER ── -->
<div id="timer" class="timer-w hidden">
  <div class="timer-lbl" id="timer-lbl">Hoạt động</div>
  <div class="timer-disp" id="timer-disp">00:00</div>
  <div class="timer-ctrl">
    <button class="tcBtn" id="timer-pause">⏸ Tạm dừng</button>
    <button class="tcBtn stop" id="timer-stop">✕ Dừng</button>
  </div>
</div>

<!-- ── FOCUS ── -->
<div id="focus-ov" class="focus-ov hidden">
  <button class="focus-exit" id="focus-exit">✕ Thoát</button>
  <div class="focus-tag" id="focus-tag">Đang làm</div>
  <div class="focus-act" id="focus-act">—</div>

// ═══════════════════════════════════════════
// RENDER STREAK
// ═══════════════════════════════════════════
function getCompletionRate(dateStr,dayKey){
  const items=state.schedule[dayKey]||[];
  if(!items.length)return 0;
  const comp=state.completions[dateStr]||{};
  const dayComp=comp[dayKey]||{};
  const done=items.filter(it=>dayComp[it.id]).length;
  return done/items.length;
}

function computeStreak(){
  // Count consecutive days (from today going back) where any item of key habits was completed
  let streak=0;
  const today=new Date();
  for(let i=0;i<60;i++){
    const d=new Date(today);
    d.setDate(d.getDate()-i);
    const dateStr=d.toISOString().split('T')[0];
    const dayKey=DOW_MAP[d.getDay()];
    const rate=getCompletionRate(dateStr,dayKey);
    if(rate>=0.5)streak++;
    else if(i>0)break;
  }
  return streak;
}

function renderStreak(){
  const streak=computeStreak();
  const wrap=document.getElementById('streak-wrap');
  let cls='s0';
  if(streak>=3&&streak<7)cls='s1';
  if(streak>=7&&streak<14)cls='s2';
  if(streak>=14)cls='s3';
  const emoji=streak===0?'—':streak<3?'🔥':streak<7?'🔥🔥':streak<14?'🔥🔥🔥':'⚡🔥⚡';
  wrap.innerHTML=`
    <div class="streak-item">
      <span class="streak-name">Chuỗi ngày liên tiếp</span>
      <span class="streak-badge ${cls}">${emoji} ${streak} ngày</span>
    </div>
    <div style="font-size:11px;color:var(--txt3);margin-top:6px;line-height:1.5">
      Hoàn thành ≥50% lịch/ngày để duy trì streak
    </div>`;
}

// ═══════════════════════════════════════════
// PARSE DURATION FROM TEXT
// ═══════════════════════════════════════════
function parseDuration(text){
  let m=text.match(/\((\d+)'\)/);
  if(m)return parseInt(m[1])*60;
  m=text.match(/(\d+\.?\d*)\s*tiếng/);
  if(m)return Math.round(parseFloat(m[1])*3600);
  m=text.match(/(\d+)\s*phút/);
  if(m)return parseInt(m[1])*60;
  return 0;
}

// ═══════════════════════════════════════════
// TIME TO MINUTES
// ═══════════════════════════════════════════
function timeToMin(t){
  const [h,m]=t.split(':').map(Number);return h*60+m;
}

  const pct=items.length?Math.round(doneCount/items.length*100):0;

  // Current item detection
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const isTodayView=activeDay===todayKey();
  let currentIdx=-1;
  if(isTodayView){
    for(let i=0;i<items.length-1;i++){
      const st=timeToMin(items[i].t);
      const en=timeToMin(items[i+1].t);
      if(nowMin>=st&&nowMin<en){currentIdx=i;break;}

  let html=`

        <h2>${dayObj.full}</h2>

      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="legend">${Object.entries(CATS).map(([k,c])=>`<span class="leg-item"><span class="leg-dot" style="background:${c.color}"></span>${c.label}</span>`).join('')}</div>
    <div class="sched-list" id="sched-list">`;

  items.forEach((item,idx)=>{
    const cat=CATS[item.c]||CATS.wellness;
    const isDone=!!dayComp[item.id];
    const isCurrent=idx===currentIdx;
    const dur=parseDuration(item.a);
    html+=`
      <div class="srow" data-idx="${idx}">
        <div class="stime">${item.t}</div>
        <div class="sbar" style="background:${cat.color}"></div>
        <div class="scard${isDone?' done':''}${isCurrent?' current-item':''}${editMode?' in-edit-mode':''}" data-id="${item.id}" data-idx="${idx}">
          <div class="chk${isDone?' yes':''}" data-chk="${item.id}" title="Đánh dấu hoàn thành">${isDone?'✓':''}</div>
          <div class="sbody">
            <div class="sact">${item.a}</div>
            ${item.tip?`<div class="stip">💡 ${item.tip}</div>`:''}
            ${dur?`<div class="sdur">⏱ ${dur>=3600?Math.round(dur/360)/10+' tiếng':Math.round(dur/60)+' phút'}</div>`:''}
          </div>
          <div class="sactions">
            ${dur?`<button class="iBtn timer-btn-item" data-timer="${item.id}" title="Bắt đầu đếm ngược">▶</button>`:''}
            ${editMode?`<button class="iBtn" data-edit="${item.id}" title="Chỉnh sửa">✏️</button><button class="iBtn del" data-del="${item.id}" title="Xóa">✕</button>`:''}
          </div>
        </div>
      </div>`;
  });

  html+=`</div>`;

  if(editMode){
    html+=`<button class="add-btn" id="add-item-btn">＋ Thêm hoạt động</button>`;
  }

  // Notes
  const noteVal=(state.notes[dateStr]||{})[activeDay]||'';
  html+=`<div class="notes-wrap">
    <div class="notes-lbl">📝 Ghi chú ngày hôm nay</div>
    <textarea class="notes-ta" id="notes-ta" placeholder="Ghi nhanh cảm nhận, thay đổi, kế hoạch...">${noteVal}</textarea>
  </div>`;

  main.innerHTML=html;

  // Events: checkboxes
  main.querySelectorAll('[data-chk]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const id=el.dataset.chk;
      if(!state.completions[dateStr])state.completions[dateStr]={};
      if(!state.completions[dateStr][activeDay])state.completions[dateStr][activeDay]={};
      state.completions[dateStr][activeDay][id]=!state.completions[dateStr][activeDay][id];
      save();renderMain();renderSidebar();
    });
  });

  // Events: edit/delete (edit mode)
  if(editMode){
    main.querySelectorAll('[data-edit]').forEach(el=>{
      el.addEventListener('click',e=>{e.stopPropagation();openEditModal(el.dataset.edit);});

    main.querySelectorAll('[data-del]').forEach(el=>{

  // Events: timer buttons
  main.querySelectorAll('[data-timer]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const item=items.find(it=>it.id===el.dataset.timer);
      if(item){const dur=parseDuration(item.a);if(dur>0)startTimer(item.a,dur);}
    });
  });

  // Notes autosave
  const ta=document.getElementById('notes-ta');
  if(ta){
    ta.addEventListener('input',()=>{
      if(!state.notes[dateStr])state.notes[dateStr]={};
      state.notes[dateStr][activeDay]=ta.value;
      save();
    });
  }

// ═══════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════
function startTimer(label,seconds){
  if(timerState.interval)clearInterval(timerState.interval);
  timerState={active:true,paused:false,total:seconds,remaining:seconds,label,interval:null};
  const widget=document.getElementById('timer');
  widget.classList.remove('hidden');
  document.getElementById('timer-lbl').textContent=label.replace(/\s*\([^)]*\)/,'').trim();
  updateTimerDisplay();
  timerState.interval=setInterval(tickTimer,1000);
}

function tickTimer(){
  if(timerState.paused)return;
  timerState.remaining--;
  updateTimerDisplay();
  if(timerState.remaining<=0){
    clearInterval(timerState.interval);
    document.getElementById('timer-disp').className='timer-disp done';
    document.getElementById('timer-disp').textContent='✓ Xong!';
  }
}

function updateTimerDisplay(){
  const r=Math.max(0,timerState.remaining);
  const m=Math.floor(r/60);const s=r%60;
  const disp=document.getElementById('timer-disp');
  disp.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  disp.className='timer-disp'+(r<60?' warning':'');
}

document.getElementById('timer-pause').addEventListener('click',()=>{
  timerState.paused=!timerState.paused;
  document.getElementById('timer-pause').textContent=timerState.paused?'▶ Tiếp':'⏸ Tạm dừng';
});
document.getElementById('timer-stop').addEventListener('click',()=>{
  if(timerState.interval)clearInterval(timerState.interval);
  timerState.active=false;
  document.getElementById('timer').classList.add('hidden');
});

function openFocus(){
  focusActive=true;
  document.getElementById('focus-ov').classList.remove('hidden');
  updateFocus();
  focusInterval=setInterval(updateFocus,1000);
}
function closeFocus(){
  focusActive=false;
  document.getElementById('focus-ov').classList.add('hidden');
  if(focusInterval)clearInterval(focusInterval);
}
function updateFocus(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('focus-clk').textContent=`${h}:${m}:${s}`;
  const dayKey=todayKey();
  const items=state.schedule[dayKey]||[];
  const nowMin=now.getHours()*60+now.getMinutes();
  let curItem=null,nextItem=null;
  for(let i=0;i<items.length;i++){
    const st=timeToMin(items[i].t);
    if(nowMin>=st){curItem=items[i];if(i<items.length-1)nextItem=items[i+1];}
  }
  document.getElementById('focus-act').textContent=curItem?curItem.a:'Không có lịch';
  document.getElementById('focus-nxt').textContent=nextItem?`Tiếp theo ${nextItem.t}: ${nextItem.a}`:'Hết lịch ngày hôm nay';
  document.getElementById('focus-tag').textContent=curItem?`${DAYS.find(d=>d.key===dayKey)?.full||''} · Đang làm`:'Hôm nay';
}
document.getElementById('focus-exit').addEventListener('click',closeFocus);
document.getElementById('btn-focus').addEventListener('click',()=>{
  if(focusActive)closeFocus();else openFocus();
});

// STATS PANEL
// ═══════════════════════════════════════════
function renderStats(){
  const el=document.getElementById('pc-stats');
  // Calculate hours per category per week
  const weekHours={};
  Object.keys(CATS).forEach(k=>weekHours[k]=0);
  DAYS.forEach(d=>{
    const items=state.schedule[d.key]||[];
    for(let i=0;i<items.length;i++){
      const dur=i<items.length-1?timeToMin(items[i+1].t)-timeToMin(items[i].t):0;
      if(dur>0){
        const cat=items[i].c;
        if(weekHours[cat]!==undefined)weekHours[cat]+=dur;
      }
    }
  });
  const maxH=Math.max(...Object.values(weekHours));
  let html=`<div class="stat-section">
    <div class="stat-title">⏰ Phân bổ thời gian / tuần</div>`;
  Object.entries(CATS).forEach(([k,c])=>{
    const mins=weekHours[k];
    const pct=maxH?Math.round(mins/maxH*100):0;
    const disp=mins>=60?Math.round(mins/60*10)/10+'h':mins+'m';
    html+=`<div class="bar-row">
      <span class="bar-label">${c.label}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <span class="bar-val">${disp}</span>
    </div>`;
  });
  html+=`</div>`;

  // Today's completion
  const dateStr=todayDate();
  const dayKey=todayKey();
  const items=state.schedule[dayKey]||[];
  const comp=(state.completions[dateStr]||{})[dayKey]||{};
  const done=items.filter(it=>comp[it.id]).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  html+=`<div class="stat-section">
    <div class="stat-title">✅ Hôm nay (${DAYS.find(d=>d.key===dayKey)?.full})</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) ${pct*3.6}deg,var(--brd) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <div style="width:46px;height:46px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ok)">${pct}%</div>
      </div>
      <div style="font-size:12px;color:var(--txt2)">${done} / ${items.length} hoạt động hoàn thành<br><span style="color:var(--txt3)">${pct>=80?'🎉 Xuất sắc!':pct>=50?'💪 Tiếp tục cố gắng':'🌱 Hãy bắt đầu nào'}</span></div>
    </div>
  </div>`;

  // Streak
  const streak=computeStreak();
  html+=`<div class="stat-section">
    <div class="stat-title">🔥 Streak</div>
    <div style="font-size:36px;font-weight:800;color:${streak>=7?'var(--acc)':streak>=3?'var(--ok)':'var(--warn)'};margin-bottom:4px">${streak} ngày</div>
    <div style="font-size:11px;color:var(--txt3)">${streak===0?'Bắt đầu streak hôm nay!':streak<3?'Tiếp tục duy trì!':streak<7?'Đang vào guồng 🔥':streak<14?'Streak ấn tượng! 🔥🔥':'Bạn là máy! ⚡🔥'}</div>
  </div>`;

  el.innerHTML=html;
}

async function sendAiMessage(){
  const inp=document.getElementById('ai-inp');
  const msg=inp.value.trim();
  if(!msg||!state.apiKey)return;
  inp.value='';
  inp.style.height='auto';

  const msgs=document.getElementById('ai-msgs');
  msgs.innerHTML+=`<div class="amsg u">${escHtml(msg)}</div>`;
  msgs.innerHTML+=`<div class="amsg thinking" id="ai-thinking">Claude đang suy nghĩ...</div>`;
  msgs.scrollTop=msgs.scrollHeight;

  // Build schedule summary for context
  const schedSummary=DAYS.map(d=>{
    const items=state.schedule[d.key]||[];
    return `${d.full}: ${items.map(i=>`${i.t} ${i.a}`).join(' | ')}`;
  }).join('\n');

  const systemPrompt=`Bạn là trợ lý quản lý thời gian thông minh. Người dùng có lịch tuần như sau:\n\n${schedSummary}\n\nHôm nay là ${DAYS.find(d=>d.key===todayKey())?.full}. Trả lời bằng tiếng Việt, ngắn gọn và thực dụng. Khi gợi ý thay đổi lịch, hãy nêu cụ thể thời gian và hoạt động.`;

  if(!state.chatHistory)state.chatHistory=[];
  state.chatHistory.push({role:'user',content:msg});

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':state.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages:state.chatHistory.slice(-10)})
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Có lỗi xảy ra. Vui lòng thử lại.';
    state.chatHistory.push({role:'assistant',content:reply});
    if(state.chatHistory.length>20)state.chatHistory=state.chatHistory.slice(-20);
    save();
    document.getElementById('ai-thinking')?.remove();
    msgs.innerHTML+=`<div class="amsg a">${escHtml(reply)}</div>`;
    msgs.scrollTop=msgs.scrollHeight;
  }catch(err){
    document.getElementById('ai-thinking')?.remove();
    msgs.innerHTML+=`<div class="amsg a" style="color:var(--err)">Lỗi kết nối: ${err.message||'Kiểm tra API key và kết nối mạng.'}</div>`;
    msgs.scrollTop=msgs.scrollHeight;
  }
}

document.getElementById('ai-send').addEventListener('click',sendAiMessage);
document.getElementById('ai-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAiMessage();}
  // Auto-resize
  setTimeout(()=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,80)+'px';},0);
});

  r.onload=ev=>{

      const imported=JSON.parse(ev.target.result);
      if(imported.schedule){
        state.schedule=imported.schedule;
        if(imported.completions)state.completions=imported.completions;
        if(imported.notes)state.notes=imported.notes;
        if(imported.apiKey)state.apiKey=imported.apiKey;

    }catch(err){alert('❌ Lỗi đọc file: '+err.message);}
    e.target.value='';
  };
  r.readAsText(file);
});

// FIREBASE + CLOUD SYNC
// ─────────────────────────────────────────────────────────────
let fbApp=null,db=null,fbAuth=null,currentUser=null;
let syncTimeout=null,snapshotUnsub=null;
let isSyncing=false;

// ── Toast helper ──
function showToast(msg,ms=2800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

// ── Sync status indicator ──
function setSyncStatus(s){
  const dot=document.getElementById('sync-dot');
  if(!dot)return;
  dot.className='sync-dot '+s;
  const titles={synced:'☁️ Đã đồng bộ',syncing:'🔄 Đang đồng bộ...',offline:'📵 Offline – chưa đăng nhập',error:'⚠️ Lỗi đồng bộ',pending:'⏳ Chờ đồng bộ...'};
  dot.title=titles[s]||s;
}

// ── Debounced upload ──
function debouncedSync(){
  if(!currentUser||!db){setSyncStatus('offline');return;}
  clearTimeout(syncTimeout);
  setSyncStatus('pending');
  syncTimeout=setTimeout(syncToCloud,1800);
}

async function syncToCloud(){
  if(!currentUser||!db)return;
  isSyncing=true;setSyncStatus('syncing');
  try{
    await db.collection('users').doc(currentUser.uid).set({
      schedule:state.schedule,
      completions:state.completions,
      notes:state.notes,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    setSyncStatus('synced');
  }catch(e){
    console.error('Sync error:',e);
    setSyncStatus('error');
    showToast('⚠️ Lỗi đồng bộ: '+e.message);
  }finally{isSyncing=false;}
}

async function loadFromCloud(){
  if(!currentUser||!db)return;
  setSyncStatus('syncing');
  try{
    const snap=await db.collection('users').doc(currentUser.uid).get();
    if(snap.exists){
      const d=snap.data();
      if(d.schedule)state.schedule=d.schedule;
      if(d.completions)state.completions=d.completions;
      if(d.notes)state.notes=d.notes;
      try{localStorage.setItem(getKey(currentUser?.uid),JSON.stringify(state));}catch{}
      renderAll();
      showToast('☁️ Đã tải dữ liệu từ đám mây');
    }else{
      // First time: push local data to cloud
      await syncToCloud();
    }
    setSyncStatus('synced');
  }catch(e){
    console.error('Load error:',e);setSyncStatus('error');
  }
}

// ── Real-time listener: updates from other devices ──
function setupRealtimeListener(){
  if(snapshotUnsub)snapshotUnsub();
  if(!currentUser||!db)return;
  snapshotUnsub=db.collection('users').doc(currentUser.uid)
    .onSnapshot(snap=>{
      if(!snap.exists||snap.metadata.hasPendingWrites||isSyncing)return;
      // Data came from server (another device)
      const d=snap.data();
      if(d.schedule)state.schedule=d.schedule;
      if(d.completions)state.completions=d.completions;
      if(d.notes)state.notes=d.notes;
      try{localStorage.setItem(getKey(currentUser?.uid),JSON.stringify(state));}catch{}
      renderAll();
      setSyncStatus('synced');
    },err=>{console.error('Snapshot:',err);setSyncStatus('error');});
}

    btn.className='auth-btn';
    btn.title='Đăng nhập để đồng bộ đám mây';

  }
}

// ── Sign in / Sign out ──
function signIn(){
  if(!fbAuth)return;
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  fbAuth.signInWithPopup(provider)
    .then(()=>showToast('✅ Đăng nhập thành công!'))
    .catch(e=>{if(e.code!=='auth/popup-closed-by-user')showToast('❌ '+e.message);});
}

async function signOut(){
  if(!fbAuth)return;
  try{
    if(snapshotUnsub)snapshotUnsub();
    await fbAuth.signOut();
    currentUser=null;
    updateAuthUI();
    setSyncStatus('offline');
    showToast('👋 Đã đăng xuất');
  }catch(e){console.error(e);}
}

// ── Init Firebase ──
function initFirebase(cfg){
  try{
    // Delete existing app if re-initializing
    if(fbApp){try{fbApp.delete();}catch{}}
    fbApp=firebase.initializeApp(cfg,'tgb-main');
    db=firebase.firestore(fbApp);
    fbAuth=firebase.auth(fbApp);

    // Enable offline persistence (data available even without internet)
    db.enablePersistence({synchronizeTabs:true}).catch(err=>{
      if(err.code==='failed-precondition')console.warn('Multi-tab persistence not available');
      else if(err.code==='unimplemented')console.warn('Offline persistence not supported');
    });

    // Listen for auth state changes
    fbAuth.onAuthStateChanged(user=>{
      const prevUid=currentUser?.uid;
      currentUser=user;
      updateAuthUI();
      if(user){
        // If switching accounts, reset state before loading
        if(prevUid && prevUid!==user.uid){
          state={schedule:JSON.parse(JSON.stringify(DEFAULT_SCHED)),completions:{},notes:{},apiKey:state.apiKey||'',chatHistory:[]};
          renderAll();
        }
        // Try user-specific localStorage first (fast load), then sync from cloud
        try{
          const cached=localStorage.getItem(getKey(user.uid));
          if(cached){
            const parsed=JSON.parse(cached);
            if(parsed.schedule){
              state.schedule=parsed.schedule;
              if(parsed.completions)state.completions=parsed.completions;
              if(parsed.notes)state.notes=parsed.notes;
              renderAll();
            }
          }
        }catch{}
        loadFromCloud();
        setupRealtimeListener();
      }else{
        if(snapshotUnsub){snapshotUnsub();snapshotUnsub=null;}
        // Reset to anonymous local data (SK_BASE key)
        try{
          const anon=localStorage.getItem(SK_BASE);
          const parsed=anon?JSON.parse(anon):null;
          state={
            schedule:(parsed?.schedule)||JSON.parse(JSON.stringify(DEFAULT_SCHED)),
            completions:(parsed?.completions)||{},
            notes:(parsed?.notes)||{},
            apiKey:state.apiKey||'',
            chatHistory:[]
          };
        }catch{
          state={schedule:JSON.parse(JSON.stringify(DEFAULT_SCHED)),completions:{},notes:{},apiKey:'',chatHistory:[]};
        }
        renderAll();
        setSyncStatus('offline');
        showToast('👤 Đã về chế độ local');
      }
    });

    return true;
  }catch(e){
    console.error('Firebase init failed:',e);
    showToast('❌ Lỗi Firebase: '+e.message);
    return false;
  }
}
